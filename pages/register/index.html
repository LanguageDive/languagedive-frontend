<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
</head>
<body>

    <div id="root">

        <!-- HEADER -->
        <div id="header">
            <div class="links">

                <a class="header links main" href="../index.html">LOGO</a>

                <a class="header links login" href="../login" >Iniciar Sesión</a>
                
            </div>

            <div class="hr"></div>
        </div>

        <!-- REGISTER -->

        <div id="register">

            <p class="register label-register">Registro</p>

            <form id="registerForm" class="register register-form">

                <label for="username">Nombre de usuario</label>
                <input type="text" name="username" id="username" placeholder="Usuario" required>

                <label for="email">Correo electrónico</label>
                <input type="email" name="email" id="email" placeholder="Correo electrónico" required>


                <label for="password" class="pwd">Contraseña</label>
                <input minlength="8" type="password" name="password" id="password" placeholder="Contraseña" required>

                <label for="rptPassword" class="rptPwd">Repetir contraseña</label>
                <input minlength="8" type="password" name="rptPassword" id="rptPassword" placeholder="Contraseña" required>

                <div id="errorMessage" class="register-form display">
                    <p>Error al crear el usuario: correo /contraseña ya están(n) en uso</p>
                </div>

                <div id="successMessage" class="register-form display">
                    <p>¡Registro Exitoso!</p>
                </div>
            </form>

            <div class="buttons">
                <button type="submit" form="registerForm">Registrarse</button>

                <a href="/login">
                    <button type="button">Cancelar</button>
                </a>
                
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
