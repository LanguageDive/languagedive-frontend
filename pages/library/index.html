<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca · LanguageDive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Lexend:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TODO > HEADER -->
    <header id="header">
        <nav id="header-links" aria-label="Principal">
            <a class="logo" href="/library/">LanguageDive</a>

            <div class="user-access">
                <a href="/vocabulary/" class="header-nav-link">
                    <span class="icon icon-cards" aria-hidden="true"></span>
                    <span class="nav-text">Grimorio</span>
                </a>
                <span id="username" class="header-user">Usuario</span>
                <a href="/login/" id="logout">Salir</a>
            </div>
        </nav>
    </header>
    <!-- ! FIN > HEADER -->

    <main>

        <div id="main-container">

            <!-- TODO > CONTENEDOR PARA MENSAJES DE ERROR CON API-->
            <div id="error-message-container" class="alert-error hide" role="alert">
                <p class="error-message-text"></p>
            </div>
            <!-- ! FIN > CONTENEDOR PARA MENSAJES DE ERROR CON API -->

            <!-- TODO > IMPORTAR -->
            <div id="import-courses" class="fade-up">
                <label class="import-label" for="epubFile">Importar:</label>

                <input type="file" id="epubFile" name="epubFile" accept=".epub" />

                <span class="import-status" aria-live="polite"></span>
            </div>
            <!-- ! FIN > IMPORTAR -->

            <div id="user-courses">
                <!-- TODO > TODOS LOS CURSOS -->
                <section id="all-courses" class="fade-up" style="--i: 1" aria-labelledby="all-courses-title">

                    <!-- TODO > TODOS LOS CURSOS HEADER-->
                    <div class="header">
                        <h2 id="all-courses-title" class="title">Todos mis cursos</h2>
                        <div class="actions">
                            <!-- Alterna entre la fila con flechas y la cuadrícula con todos los cursos (cards-pager.js).
                                 Oculto hasta saber si hay más cursos de los que caben en la fila -->
                            <button type="button" class="see-more hide" aria-expanded="false"
                                aria-controls="all-courses-cards">Ver más</button>
                            <div class="btns-page-shift">
                                <button class="previous-page btn btn-round" type="button" aria-label="Cursos anteriores">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-arrow-left" viewBox="0 0 16 16" aria-hidden="true">
                                        <path fill-rule="evenodd"
                                            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
                                    </svg>
                                </button>
                                <button class="next-page btn btn-round" type="button" aria-label="Cursos siguientes">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-arrow-right" viewBox="0 0 16 16" aria-hidden="true">
                                        <path fill-rule="evenodd"
                                            d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- ! FIN > TODOS LOS CURSOS HEADER-->

                    <!-- TODO > TODOS LOS CURSOS CARD CONTAINER-->
                    <div class="cards" id="all-courses-cards">
                        <!-- TODO > CONTENEDOR DE MENSAJE SIN CURSOS -->
                        <div class="no-courses-container hide">
                            <p>No tienes cursos importados aún</p>
                        </div>
                        <!-- ! FIN > CONTENEDOR DE MENSAJE SIN CURSOS -->

                        <!-- TODO > CARD ESPECIFICA (la crea load-course-cards.js) -->
                        <!-- <a class="card" href="../course/index.html?id=1">
                        <div class="course-creation">Creado el [dd] del [mm] de [aaaa]</div>
                        <div class="course-image">
                            <img src="../assets/nickype-snow-7646952.jpg" alt="">
                        </div>
                        <div class="course-info">
                            <h3 class="course-name">Titulo</h3>
                            <hr>
                            <div class="course-lessons-number">N lecciones</div>
                        </div>
                    </a> -->
                        <!-- ! FIN > CARD ESPECIFICA -->
                    </div>
                    <!-- ! FIN > TODOS LOS CURSOS CARD CONTAINER-->
                </section>
                <!-- ! FIN > TODOS LOS CURSOS -->

                <!-- TODO > CURSOS EN PROGRESO -->
                <section id="in-progress-courses" class="fade-up" style="--i: 2"
                    aria-labelledby="in-progress-courses-title">
                    <!-- TODO > CURSOS EN PROGRESO HEADER-->
                    <div class="header">
                        <h2 id="in-progress-courses-title" class="title">En progreso</h2>
                        <div class="actions">
                            <button type="button" class="see-more hide" aria-expanded="false"
                                aria-controls="in-progress-courses-cards">Ver más</button>
                            <div class="btns-page-shift">
                                <button class="previous-page btn btn-round" type="button" aria-label="Cursos anteriores">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-arrow-left" viewBox="0 0 16 16" aria-hidden="true">
                                        <path fill-rule="evenodd"
                                            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
                                    </svg>
                                </button>
                                <button class="next-page btn btn-round" type="button" aria-label="Cursos siguientes">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-arrow-right" viewBox="0 0 16 16" aria-hidden="true">
                                        <path fill-rule="evenodd"
                                            d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- ! FIN > CURSOS EN PROGRESO HEADER-->

                    <!-- TODO > CURSOS EN PROGRESO CARD CONTAINER-->
                    <div class="cards" id="in-progress-courses-cards">
                        <!-- TODO > CONTENEDOR DE MENSAJE SIN CURSOS -->
                        <div class="no-courses-container hide">
                            <p>No tienes cursos en progreso aún</p>
                        </div>
                        <!-- ! FIN > CONTENEDOR DE MENSAJE SIN CURSOS -->
                    </div>
                    <!-- ! FIN > CURSOS EN PROGRESO CARD CONTAINER-->
                </section>
                <!-- ! FIN > CURSOS EN PROGRESO -->
            </div>
        </div>
    </main>

    <footer>

    </footer>

    <script type="module" src="epub-import.js"></script>
    <script type="module" src="load-course-cards.js"></script>

</body>

</html>
