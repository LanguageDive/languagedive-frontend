<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- TODO > HEADER -->
    <header>
        <div id="header">
            <div id="header-links">
                <a class="header links main" href="#">LOGO</a>

                <div class="userAccess">
                    <a id="username" class="header links register" href="#">Usuario</a>
                    <a href="/login/" id="logout" class="header links exit">Salir</a>
                </div>
            </div>

            <div class="hr"></div>
        </div>

    <main>
        <!-- TODO > CONTENEDOR PADRE (GRID) -->
        <div id="main--grid-container">

            <div id="grid-left">

                <div class="return">
                    <a href="/library/">
                        <svg class="back-arrow" viewBox="0 0 24 24" xmlns="http://w3.org" height="34">
                            <line x1="19" y1="12" x2="5" y2="12" />
                            <polyline points="12 19 5 12 12 5" />

                <!-- TODO > TODAS LAS LECCIONES CONTENEDOR-->
                <div class="cards">

                    <div class="card">

                                <hr>
                                <p class="lesson-chapter-name">Nombre del capitulo</p>
                            </div>
                            <div class="left-lower">
                                <div class="lesson-progress">15%</div>
                            </div>
                        </div>
                        <div class="card-right">
                            <a href="#" class="continue-lesson">
                                Continuar

                                    height="34">
                                    <line x1="5" y1="12" x2="19" y2="12" />
                                    <polyline points="12 5 19 12 12 19" />
                                </svg>
                            </a>
                        </div>
                    </div>
                    <!-- ! FIN > CARD-->

                    <!-- TODO > CARD-->
                    <div class="card">
                        <div class="card-left">
                            <div class="left-upper">
                                <p class="lesson-number">Leccion 1</p>
                                <hr>
                                <p class="lesson-chapter-name">Nombre del capitulo</p>
                            </div>
                            <div class="left-lower">
                                <div class="lesson-progress">15%</div>
                            </div>
                        </div>
                        <div class="card-right">
                            <a href="#" class="continue-lesson">
                                Continuar
                                <svg class="forward-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                    height="34">
                                    <line x1="5" y1="12" x2="19" y2="12" />
                                    <polyline points="12 5 19 12 12 19" />
                                </svg>
                            </a>
                        </div>
                    </div>
                    <!-- ! FIN > CARD-->
                </div>
                <!-- ! FIN > TODAS LAS LECCIONES CONTENEDOR-->

            </div>
            <!-- ! FIN > CONTENEDOR HIJO IZQUIERDA (GRID) -->

            <!-- TODO > CONTENEDOR HIJO DERECHA (GRID) -->
            <div class="grid-right">
                <!-- TODO > PREVIEW DEL CURSO -->
                <div class="course-preview">
                    <div class="course-creation-date">
                        Creado el [dd] del [mes] del [aaaa]
                    </div>

                    <div class="course-image-container">
                        <img src="../assets/nickype-snow-7646952.jpg" alt="snow image">
                        <a href="#" class="btn-continue">
                            <p class="text">Continuar</p>
                            <svg class="forward-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                height="34">
                                <line x1="5" y1="12" x2="19" y2="12" />
                                <polyline points="12 5 19 12 12 19" />
                            </svg>
                        </a>
                    </div>
                </div>
                <!-- ! FIN > PREVIEW DEL CURSO -->

                <!-- TODO > DETALLES DEL CURSO -->
                <div class="course-details">
                    <div class="course-name">Titulo</div>
                    <div class="course-description">

                    </div>
                    <div class="course-progress-percentage">Progreso: 15%</div>

                    <div class="course-progress-fraction">Leccion n / m</div>
                </div>
                <!-- ! FIN > DETALLES DEL CURSO -->
            </div>
            <!-- ! FIN > CONTENEDOR HIJO DERECHA (GRID) -->
        </div>

    </main>
