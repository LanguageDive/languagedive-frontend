<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso · LanguageDive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Lexend:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TODO > HEADER -->
    <header id="header">
        <nav id="header-links" aria-label="Principal">
            <a class="logo" href="/library/">LanguageDive</a>

            <div class="user-access">
                <a href="/vocabulary/" class="header-nav-link">
                    <span class="icon icon-cards" aria-hidden="true"></span>
                    <span class="nav-text">Grimorio</span>
                </a>
                <span id="username" class="header-user">Usuario</span>
                <a href="/login/" id="logout">Salir</a>
            </div>
        </nav>
    </header>
    <!-- ! FIN > HEADER -->

    <main>
        <!-- TODO > CONTENEDOR PADRE (GRID) -->
        <!-- is-loading tapa con esqueletos los textos con data-skeleton hasta que script.js carga el curso -->
        <div id="main-grid-container" class="is-loading">

            <!-- TODO > CONTENEDOR HIJO IZQUIERDA (GRID) -->
            <div id="grid-left">

                <!-- TODO > CONTENEDOR REGRESAR -->
                <div class="return fade-up">
                    <a href="/library/" class="btn">
                        <svg class="back-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" height="34" aria-hidden="true">
                            <line x1="19" y1="12" x2="5" y2="12" />
                            <polyline points="12 19 5 12 12 5" />
                        </svg>
                        <p class="text">Regresar</p>
                    </a>


                </div>
                <!-- ! FIN > CONTENEDOR REGRESAR -->

                <!-- TODO > NUMERO DE LECCIONES DEL CURSO-->
                <div class="lessonsNumber fade-up" style="--i: 1">
                    <h2 class="text" data-skeleton>Lecciones (N)</h2>
                </div>
                <!-- ! FIN > NUMERO DE LECCIONES DEL CURSO-->


                <!-- TODO > TODAS LAS LECCIONES CONTENEDOR-->
                <div class="cards">
                    <!-- TODO > CARD MACHOTE DE CARD
                    <div class="card">
                        <div class="card-left">
                            <div class="left-upper">
                                <p class="lesson-number">Leccion 1</p>
                                <hr>
                                <p class="lesson-chapter-name">Nombre del capitulo</p>
                            </div>
                            <div class="left-lower">
                                <div class="lesson-progress">15%</div>
                            </div>
                        </div>
                        <div class="card-right">
                            <a href="#" class="continue-lesson">
                                Continuar
                                <svg class="forward-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                    height="34">
                                    <line x1="5" y1="12" x2="19" y2="12" />
                                    <polyline points="12 5 19 12 12 19" />
                                </svg>
                            </a>
                        </div>
                    </div> -->
                    <!-- ! FIN > CARD-->
                </div>
                <!-- ! FIN > TODAS LAS LECCIONES CONTENEDOR-->

            </div>
            <!-- ! FIN > CONTENEDOR HIJO IZQUIERDA (GRID) -->

            <!-- TODO > CONTENEDOR HIJO DERECHA (GRID) -->
            <aside class="grid-right fade-up" style="--i: 2" aria-label="Detalles del curso">
                <!-- TODO > PREVIEW DEL CURSO -->
                <div class="course-preview">
                    <div class="course-creation-date" data-skeleton>
                        Creado el [dd] del [mes] del [aaaa]
                    </div>

                    <!-- Portada y "Continuar" se tapan con un esqueleto hasta que llega el curso -->
                    <div class="course-image-container" data-skeleton>
                        <img src="../assets/nickype-snow-7646952.jpg" alt="Portada del curso" decoding="async">
                        <a href="#" class="btn-continue btn btn-sunny">
                            <p class="text">Continuar</p>
                            <svg class="forward-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                height="34" aria-hidden="true">
                                <line x1="5" y1="12" x2="19" y2="12" />
                                <polyline points="12 5 19 12 12 19" />
                            </svg>
                        </a>
                    </div>
                </div>
                <!-- ! FIN > PREVIEW DEL CURSO -->

                <!-- TODO > DETALLES DEL CURSO -->
                <div class="course-details">
                    <h1 class="course-name" data-skeleton>Titulo</h1>
                    <div class="course-description">
                        <strong>Descripción:</strong>
                        <span class="course-description-text" data-skeleton>Descripción del curso</span>
                    </div>
                    <div class="course-progress-percentage" data-skeleton>Progreso: 15%</div>

                    <div class="course-progress-fraction" data-skeleton>Leccion n / m</div>
                </div>
                <!-- ! FIN > DETALLES DEL CURSO -->
            </aside>
            <!-- ! FIN > CONTENEDOR HIJO DERECHA (GRID) -->
        </div>
        <!-- ! FIN > CONTENEDOR PADRE (GRID) -->
    </main>

    <script type="module" src="script.js"></script>
</body>

</html>
