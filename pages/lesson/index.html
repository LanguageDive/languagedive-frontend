<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección · LanguageDive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Lexend:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TODO > HEADER -->
    <header id="header">
        <nav id="header-links" aria-label="Principal">
            <a class="logo" href="/library/">LanguageDive</a>

            <div class="user-access">
                <a href="/vocabulary/" class="header-nav-link">
                    <span class="icon icon-cards" aria-hidden="true"></span>
                    <span class="nav-text">Grimorio</span>
                </a>
                <span id="username" class="header-user">Usuario</span>
                <a href="/login/" id="logout">Salir</a>
            </div>
        </nav>
    </header>
    <!-- ! FIN > HEADER -->

    <!-- TODO > MAIN-->
    <main>

        <!-- TODO > CONTENDOR GRID PRINCIPAL -->
        <!-- is-loading tapa con esqueletos los textos con data-skeleton hasta que script.js carga la lección -->
        <div id="main-grid" class="is-loading">

            <!-- TODO > GRID IZQUIERDA -->
            <section id="grid-left" class="fade-up" aria-labelledby="reading-lesson-name">
                <div id="reader-header">
                    <a href="/course/" class="btn-exit btn">
                        <svg class="back-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" height="34"
                            aria-hidden="true">
                            <line x1="19" y1="12" x2="5" y2="12" />
                            <polyline points="12 19 5 12 12 5" />
                        </svg>
                        <span class="text">Salir</span>
                    </a>

                    <div class="text">
                        <h1 id="reading-lesson-name" class="reading-lesson-name" data-skeleton>
                            Leyendo: Título de la lección
                        </h1>
                        <!-- La barra se llena con --progress, que actualiza script.js -->
                        <p class="page-progress" aria-live="polite" data-skeleton>
                            Página 1 / 1 · 0%
                        </p>
                        <!-- "Guardando…" / "Progreso guardado" mientras se guarda el progreso -->
                        <p class="save-status" aria-live="polite"></p>
                    </div>
                </div>

                <div id="reader-main">
                    <div class="reader-text">
                        <!-- Oraciones de la página actual (las crea script.js); mientras tanto, líneas de carga -->
                        <span class="skeleton reader-skeleton-line" style="width: 96%"></span>
                        <span class="skeleton reader-skeleton-line" style="width: 88%"></span>
                        <span class="skeleton reader-skeleton-line" style="width: 92%"></span>
                        <span class="skeleton reader-skeleton-line" style="width: 64%"></span>
                    </div>
                </div>

                <!-- Fuera de #reader-main para que no se mueva con el largo del texto ni se recorte con su scroll -->
                <nav class="reader-nav" aria-label="Páginas de la lección">
                    <button type="button" id="prev-page" class="btn">
                        <svg class="back-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" height="34"
                            aria-hidden="true">
                            <line x1="19" y1="12" x2="5" y2="12" />
                            <polyline points="12 19 5 12 12 5" />
                        </svg>
                        <span class="text">Página anterior</span>
                    </button>
                    <button type="button" id="next-page" class="btn btn-primary">
                        <span class="text">Página siguiente</span>
                        <svg class="forward-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                            height="34" aria-hidden="true">
                            <line x1="5" y1="12" x2="19" y2="12" />
                            <polyline points="12 5 19 12 12 19" />
                        </svg>
                    </button>
                    <!-- En la última página ocupa el lugar de "Página siguiente": completa la lección y la celebra -->
                    <button type="button" id="finish-lesson" class="btn btn-sunny hide">
                        <span class="icon icon-star" aria-hidden="true"></span>
                        <span class="text">Terminar</span>
                    </button>
                </nav>

                <div id="reader-footer">
                    <button type="button" id="page-view" aria-pressed="true">Vista de Página</button>
                    <button type="button" id="sentence-view" aria-pressed="false">Vista de oración</button>
                </div>
            </section>
            <!-- ! FIN > GRID IZQUIERDA -->

            <!-- TODO > GRID DERECHA -->
            <aside id="grid-right" class="fade-up" style="--i: 2" aria-label="Palabra seleccionada">
                <div class="word-details" aria-live="polite">
                    <div class="word-header">
                        <h2 class="word" data-skeleton>Selecciona una palabra</h2>
                        <!-- Pronuncia la palabra con la voz del navegador; se oculta si no hay voz -->
                        <button type="button" class="speak-word btn btn-round hide" aria-label="Escuchar la palabra">
                            <span class="icon icon-speaker" aria-hidden="true"></span>
                        </button>
                    </div>

                    <div class="meaning">
                        <p class="title">Definición:</p>
                        <p class="definition" data-skeleton>Haz clic en una palabra del texto.</p>
                    </div>

                    <div id="traduction-container">
                        <p class="title">Traducciones</p>

                        <ul class="traduction-list">
                            <!-- Traducciones guardadas (las crea script.js) -->
                        </ul>

                        <!-- Traducciones sugeridas: al tocar una se guarda en el grimorio -->
                        <div class="suggestions hide" aria-live="polite">
                            <p class="suggestions-label">Sugerencias</p>
                            <div class="suggestion-list"></div>
                            <p class="suggestions-credit">
                                Sugerencias de <a href="https://mymemory.translated.net" target="_blank"
                                    rel="noopener noreferrer">MyMemory</a>
                            </p>
                        </div>

                        <label class="visually-hidden" for="customize-traduction">Traducción personalizada</label>
                        <input type="text" name="customize-traduction" id="customize-traduction"
                            placeholder="Traducción personalizada">

                        <button type="button" class="btn btn-sunny">Agregar</button>
                    </div>
                </div>

                <div id="word-progress-buttons" role="group" aria-label="Estado de la palabra">
                    <button type="button" class="unknown" aria-label="Ignorar palabra">X</button>
                    <button type="button" class="level-one" aria-label="Nivel 1">1</button>
                    <button type="button" class="level-two" aria-label="Nivel 2">2</button>
                    <button type="button" class="level-three" aria-label="Nivel 3">3</button>
                    <button type="button" class="level-four" aria-label="Nivel 4">4</button>
                    <button type="button" class="level-five" aria-label="Nivel 5">5</button>
                    <button type="button" class="kwnown" aria-label="Palabra aprendida">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-check" viewBox="0 0 16 16" aria-hidden="true">
                            <path
                                d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z" />
                        </svg>
                    </button>
                </div>
            </aside>
            <!-- ! FIN > GRID DERECHA -->
        </div>
        <!-- ! FIN > CONTENDOR GRID PRINCIPAL -->

    </main>
    <!-- ! FIN > MAIN-->

    <script type="module" src="script.js"></script>

</body>

</html>
