<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
</head>

<body>

    <div id="root">

        <!-- HEADER: INCLUDES
                                - BUTTON FOR LOGO TO MAIN PAGE 
                                - REGISTER BUTTON
        -->
        <div id="header">
            <div class="links">

                <a class="header links main" href="#">LOGO</a>

                <a class="header links register" href="/register">Registrarse</a>

            </div>

            <div class="hr"></div>
        </div>


        <!-- LOGIN: INCLUDES
                                - ANYTHING RELATED TO LOGIN
         -->
        <div id="login">

            <p class="login label-login">Iniciar Sesión</p>

            <form id="loginForm" class="login login-form">

                <label for="username">Correo / Nombre de usuario</label>
                <input type="text" name="identifier" id="username" placeholder="Usuario" required autocomplete="username">

                <label for="password" class="pwd">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="Contraseña" required autocomplete="current-password">

                <div id="errorMessage" class="register-form display">
                    <p>Usuario y / o contraseña incorrectos</p>
                </div>

                <div id="successMessage" class="register-form display">
                    <p>¡Inicio de sesión exitoso!</p>
                </div>

            </form>

            <button type="submit" form="loginForm">Iniciar Sesión</button>

            <div id="no-acc">

                <a class="no-acc forgot-pwd" href="./forgot-password.html">¿Olvidaste tu contraseña?</a>

                <div class="hr"></div>

                <p class="no-acc label">¿No tienes cuenta?</p>

                <a class="no-acc register" href="/register">Regístrate aquí</a>

            </div>

        </div>

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
